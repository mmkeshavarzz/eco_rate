<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قیمت لحظه‌ای بازار</title>
<style>
:root {
  --bg: oklch(97% 0.004 255);
  --surface: oklch(100% 0 0);
  --border: oklch(91% 0.006 255);
  --text: oklch(16% 0.016 255);
  --muted: oklch(53% 0.010 255);
  --gold-c: oklch(63% 0.150 70);
  --gold-bg: oklch(97% 0.022 70);
  --silver-c: oklch(47% 0.011 255);
  --silver-bg: oklch(96% 0.006 255);
  --usd-c: oklch(51% 0.142 148);
  --usd-bg: oklch(96% 0.036 148);
  --up: oklch(46% 0.14 148);
  --up-bg: oklch(94% 0.045 148);
  --dn: oklch(50% 0.16 25);
  --dn-bg: oklch(95% 0.048 25);
  --warn-bg: oklch(97% 0.022 80);
  --warn-border: oklch(86% 0.08 80);
  --warn-text: oklch(38% 0.12 60);
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: oklch(13% 0.006 255);
    --surface: oklch(18% 0.007 255);
    --border: oklch(27% 0.007 255);
    --text: oklch(93% 0.004 255);
    --muted: oklch(59% 0.008 255);
    --gold-c: oklch(73% 0.138 70);
    --gold-bg: oklch(21% 0.028 70);
    --silver-c: oklch(69% 0.009 255);
    --silver-bg: oklch(21% 0.005 255);
    --usd-c: oklch(66% 0.128 148);
    --usd-bg: oklch(19% 0.038 148);
    --up: oklch(62% 0.13 148);
    --up-bg: oklch(20% 0.055 148);
    --dn: oklch(65% 0.13 25);
    --dn-bg: oklch(20% 0.055 25);
    --warn-bg: oklch(19% 0.028 70);
    --warn-border: oklch(32% 0.09 65);
    --warn-text: oklch(72% 0.10 65);
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Tahoma, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 40px 16px 60px;
}
.wrap { max-width: 900px; margin: 0 auto; }
.header { text-align: center; margin-bottom: 28px; }
h1 { font-size: clamp(1.3rem, 3vw, 1.7rem); font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
.subtitle { font-size: .82rem; color: var(--muted); margin-bottom: 4px; }
.src-tag {
  display: inline-block;
  font-size: .72rem; color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 2px 10px; border-radius: 20px;
  min-width: 120px;
  transition: opacity .2s;
}

/* notice */
.notice {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--warn-bg);
  border: 1px solid var(--warn-border);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: .78rem; color: var(--warn-text);
  line-height: 1.65;
  margin-bottom: 20px;
}
.notice strong { display: block; margin-bottom: 2px; }

/* grid */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-bottom: 24px; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 20px 18px 16px;
  box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 3px 12px rgba(0,0,0,.05);
  transition: transform .15s, box-shadow .15s;
  position: relative; overflow: hidden;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 3px 6px rgba(0,0,0,.07), 0 10px 22px rgba(0,0,0,.08); }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: var(--r) var(--r) 0 0; }
.card.gold::before   { background: var(--gold-c); }
.card.silver::before { background: var(--silver-c); }
.card.usd::before    { background: var(--usd-c); }
.ico {
  width: 44px; height: 44px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem; margin-bottom: 14px;
}
.card.gold .ico   { background: var(--gold-bg); }
.card.silver .ico { background: var(--silver-bg); }
.card.usd .ico    { background: var(--usd-bg); }
.label { font-size: .75rem; color: var(--muted); font-weight: 600; margin-bottom: 10px; text-transform: uppercase; letter-spacing: .04em; }
.price-row { display: flex; align-items: baseline; gap: 6px; min-height: 2.2rem; }
.price { font-size: 1.6rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.card.gold .price   { color: var(--gold-c); }
.card.silver .price { color: var(--silver-c); }
.card.usd .price    { color: var(--usd-c); }
.unit { font-size: .72rem; color: var(--muted); }
.badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: .68rem; font-weight: 700;
  padding: 3px 8px; border-radius: 20px; margin-top: 8px;
  opacity: 0; transition: opacity .2s;
}
.badge.visible { opacity: 1; }
.badge.up { background: var(--up-bg); color: var(--up); }
.badge.dn { background: var(--dn-bg); color: var(--dn); }
.divider { height: 1px; background: var(--border); margin: 12px 0 8px; }
.time { font-size: .7rem; color: var(--muted); }

/* skeleton */
.sk {
  display: inline-block; width: 110px; height: 1.7rem;
  background: linear-gradient(90deg, var(--border) 25%, var(--bg) 50%, var(--border) 75%);
  background-size: 200% 100%;
  animation: sh 1.4s infinite;
  border-radius: 6px; vertical-align: bottom;
}
@keyframes sh { from{background-position:200% 0} to{background-position:-200% 0} }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } }

/* footer */
.footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.ts { font-size: .76rem; color: var(--muted); display: flex; align-items: center; gap: 7px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--usd-c); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
.btn {
  background: var(--usd-c); color: #fff;
  border: none; border-radius: 9px;
  padding: 10px 22px;
  font-size: .83rem; font-weight: 700; font-family: inherit;
  cursor: pointer; display: flex; align-items: center; gap: 6px;
  transition: opacity .15s, transform .1s;
}
.btn:hover { opacity: .85; }
.btn:active { transform: scale(.97); }
.btn:focus-visible { outline: 2px solid var(--usd-c); outline-offset: 3px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* error */
.err {
  background: var(--dn-bg); border: 1px solid oklch(82% .07 25);
  border-radius: 10px; padding: 14px 16px;
  font-size: .8rem; color: var(--dn); line-height: 1.7;
  margin-bottom: 20px; display: none;
}
.err code { font-size: .76rem; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>📊 قیمت لحظه‌ای بازار</h1>
    <p class="subtitle">طلا ۱۸ عیار · نقره · دلار — به‌روزرسانی هر ۶۰ ثانیه</p>
    <span class="src-tag" id="srcTag">در حال اتصال...</span>
  </div>

  <div class="err" id="errBox" role="alert"></div>

  <div class="grid">
    <div class="card gold" role="region" aria-label="قیمت طلا">
      <div class="ico" aria-hidden="true">🥇</div>
      <div class="label">هر میلی‌گرم طلا ۱۸ عیار</div>
      <div class="price-row">
        <span class="price" id="gp" aria-live="polite"><span class="sk"></span></span>
        <span class="unit">ریال</span>
      </div>
      <div class="badge" id="gb" aria-live="polite"></div>
      <div class="divider"></div>
      <div class="time" id="gt">—</div>
    </div>

    <div class="card silver" role="region" aria-label="قیمت نقره">
      <div class="ico" aria-hidden="true">🥈</div>
      <div class="label">هر میلی‌گرم نقره</div>
      <div class="price-row">
        <span class="price" id="sp" aria-live="polite"><span class="sk"></span></span>
        <span class="unit">ریال</span>
      </div>
      <div class="badge" id="sb" aria-live="polite"></div>
      <div class="divider"></div>
      <div class="time" id="st">—</div>
    </div>

    <div class="card usd" role="region" aria-label="قیمت دلار">
      <div class="ico" aria-hidden="true">💵</div>
      <div class="label">دلار آمریکا — بازار آزاد</div>
      <div class="price-row">
        <span class="price" id="dp" aria-live="polite"><span class="sk"></span></span>
        <span class="unit">ریال</span>
      </div>
      <div class="badge" id="db" aria-live="polite"></div>
      <div class="divider"></div>
      <div class="time" id="dt">—</div>
    </div>
  </div>

  <div class="footer">
    <div class="ts">
      <span class="dot" aria-hidden="true"></span>
      <span id="lastUpdate">هنوز به‌روز نشده</span>
    </div>
    <button class="btn" id="refreshBtn" onclick="boot()">🔄 به‌روزرسانی</button>
  </div>
</div>
